<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <style>
    rect { fill: #FFFFFF; }
    @media (prefers-color-scheme: light) {
      rect { fill: #000000; }
    }
  </style>
  <!-- Top bar -->
  <rect x="1" y="1" width="14" height="1"/>
  <!-- Upper outline -->
  <rect x="2" y="2" width="1" height="1"/>
  <rect x="13" y="2" width="1" height="1"/>
  <rect x="3" y="3" width="1" height="1"/>
  <rect x="12" y="3" width="1" height="1"/>
  <rect x="4" y="4" width="1" height="1"/>
  <rect x="11" y="4" width="1" height="1"/>
  <rect x="5" y="5" width="1" height="1"/>
  <rect x="10" y="5" width="1" height="1"/>
  <rect x="6" y="6" width="1" height="1"/>
  <rect x="9" y="6" width="1" height="1"/>
  <!-- Neck -->
  <rect x="7" y="7" width="2" height="2"/>
  <!-- Lower filled sand -->
  <rect x="6" y="9" width="4" height="1"/>
  <rect x="5" y="10" width="6" height="1"/>
  <rect x="4" y="11" width="8" height="1"/>
  <rect x="3" y="12" width="10" height="1"/>
  <rect x="2" y="13" width="12" height="1"/>
